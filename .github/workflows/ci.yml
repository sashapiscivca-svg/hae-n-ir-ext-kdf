name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the released hae package (runtime only, no PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install "hae @ git+https://github.com/sashapiscivca-svg/hae@v1.0.0" pytest
      - name: Checksums
        run: cd models/hae-n-ir-ext-kdf && sha256sum -c SHA256SUMS
      - name: CPU features and raw counts (int8 and fp32)
        run: |
          grep -m1 "model name" /proc/cpuinfo; grep -o -m1 -w "avx512_vnni\|avx_vnni\|avx512f\|avx2" /proc/cpuinfo | sort -u | tr "\n" " "; echo
          python -c "
          from hae.detector import Detector
          for m in ('hae-n-ir-ext-kdf_lwir_int8.onnx', 'hae-n-ir-ext-kdf_lwir.onnx'):
              for p in ('balanced', 'sensitive'):
                  d = Detector('models/hae-n-ir-ext-kdf/' + m, preset=p, threads=2)
                  print(m, p, [len(d.predict('examples/frames/' + f)) for f in ('1-hituav-night-60m.png', '3-hituav-night-100m-nadir.png')])
          "
      - name: Box counts on HIT-UAV frames with the committed int8 model (no downloads)
        run: pytest -q tests
      - name: Example and CLI
        run: |
          python examples/detect.py examples/frames/1-hituav-night-60m.png
          HAE_MODELS=models hae info hae-n-ir-ext-kdf
          hae predict models/hae-n-ir-ext-kdf/hae-n-ir-ext-kdf_lwir_int8.onnx examples/frames --json --project /tmp/runs
